name: Develop

on:
  push:
    branches: [develop]

permissions:
  contents: read

env:
  YARN_VERSION: 4.18.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - run: yarn lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - run: yarn test

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - run: yarn test:coverage --coverageReporters=text --coverageReporters=lcov
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - run: yarn build:ts
