name: PR Checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  YARN_VERSION: 4.18.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - run: yarn lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PRs to develop: single version; PRs to main: full matrix
        node-version: ${{ github.base_ref == 'main' && fromJSON('[22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - run: yarn build:ts
