name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  YARN_VERSION: 4.13.0

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify release metadata
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}."
            echo "Expected tag: ${EXPECTED_TAG}"
            exit 1
          fi
          if ! grep -Fq "## [${PACKAGE_VERSION}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for ${PACKAGE_VERSION}."
            exit 1
          fi
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libblas-dev
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - run: yarn build:ts
      - run: yarn lint
      - run: yarn test
      - run: yarn package:verify

  publish:
    name: Publish to GitHub Packages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@diogoribeiro7"
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libblas-dev
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - run: yarn build:ts
      - run: yarn package:verify
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Extract release notes from changelog
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          awk -v version="${PACKAGE_VERSION}" '
            index($0, "## [" version "] - ") == 1 { capture = 1 }
            capture && /^## \[/ && index($0, "## [" version "] - ") != 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Could not extract CHANGELOG.md section for ${PACKAGE_VERSION}."
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
