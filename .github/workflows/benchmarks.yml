name: Benchmarks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build:ts

      - name: Run benchmarks (JSON output)
        run: yarn bench:all
        env:
          BENCH_JSON: "1"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark/results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Compare against baselines
        id: bench-compare
        if: github.event_name == 'pull_request'
        run: |
          set +e
          OUTPUT=$(node scripts/compare-benchmarks.js benchmark/results/benchmark-results.json benchmark/BASELINES.md 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "bench_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "regression=true" >> "$GITHUB_OUTPUT"
          else
            echo "regression=false" >> "$GITHUB_OUTPUT"
          fi
          exit $EXIT_CODE

      - name: Comment on PR with benchmark results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const regression = '${{ steps.bench-compare.outputs.regression }}' === 'true';
            const output = `${{ steps.bench-compare.outputs.bench_output }}`;
            const icon = regression ? '🔴' : '🟢';
            const status = regression ? 'Performance Regression Detected' : 'No Performance Regressions';

            const body = `## ${icon} Benchmark Results: ${status}

            \`\`\`
            ${output}
            \`\`\`

            <sub>Compared against baselines in \`benchmark/BASELINES.md\`. Threshold: >10% slower triggers a warning.</sub>`;

            // Find existing benchmark comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Benchmark Results:')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
