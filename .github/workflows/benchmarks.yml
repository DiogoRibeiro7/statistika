name: Benchmarks

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "src/**"
      - "benchmark/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benchmark/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build:ts
      - name: Run benchmarks
        run: yarn bench:all
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark/results/
          retention-days: 30
          if-no-files-found: ignore
