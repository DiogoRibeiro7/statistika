name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea below.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the library does this relate to?
      options:
        - Distributions
        - Hypothesis Tests
        - Regression / Models
        - Time Series / Forecasting
        - Multivariate Analysis
        - Bayesian / MCMC
        - Utilities / Math
        - Native Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Why is it needed?
      placeholder: I'm working on X and need the ability to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your ideal API or approach.
      render: typescript
      placeholder: |
        import { newFunction } from 'node_stats';
        const result = newFunction(data, { option: true });
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've considered or workarounds you're using.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to papers, implementations, or documentation that describe the algorithm or technique.
