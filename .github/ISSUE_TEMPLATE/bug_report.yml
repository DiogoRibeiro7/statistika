name: Bug Report
description: Report a bug or incorrect result
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
      placeholder: When calling `arima(series, 2, 1, 1)` with a seasonal dataset...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code to reproduce the issue.
      render: typescript
      placeholder: |
        import { arima } from 'node_stats';
        const series = [1, 2, 3, ...];
        const result = arima(series, 2, 1, 1);
        // Expected: ...
        // Actual: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages if applicable.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: node_stats version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: node-version
    attributes:
      label: Node.js version
      options:
        - "22.x"
        - "24.x"
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any additional information (stack traces, screenshots, etc.).
